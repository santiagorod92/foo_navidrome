name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: triggering ref)"
        required: false
        type: string
        default: ""
      version:
        description: "Version to stamp into the DLL (default: scripts/version.sh, i.e. git describe)"
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}
      asset-name:
        description: "Filename of the packaged .fb2k-component"
        value: ${{ jobs.build.outputs.asset-name }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build (default: selected ref)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-2022

    outputs:
      artifact-name: ${{ steps.pkg.outputs.artifact_name }}
      asset-name: ${{ steps.pkg.outputs.asset_name }}

    steps:
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: foobar2000/foo_navidrome
          fetch-depth: 0

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          repository: reupen/foobar2000-sdk-unmodified
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        shell: bash
        run: |
          set -euo pipefail
          SDK_INNER="_sdk-staging/foobar2000"
          for d in SDK helpers shared foobar2000_component_client; do
            if [ -d "$SDK_INNER/$d" ]; then
              mv "$SDK_INNER/$d" "foobar2000/$d"
              echo "moved $SDK_INNER/$d -> foobar2000/$d"
            fi
          done
          for d in pfc libPPUI columns_ui-sdk; do
            if [ -d "_sdk-staging/$d" ]; then
              mv "_sdk-staging/$d" "$d"
              echo "moved _sdk-staging/$d -> $d"
            fi
          done
          for d in foobar2000/SDK foobar2000/helpers foobar2000/shared \
                   foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              echo "Contents of _sdk-staging root:" >&2
              ls -la _sdk-staging 2>/dev/null || true
              echo "Contents of _sdk-staging/foobar2000:" >&2
              ls -la _sdk-staging/foobar2000 2>/dev/null || true
              exit 1
            fi
          done
          rm -rf _sdk-staging

      - name: Work around missing wrap_pfc_hooks.h include in the SDK's shared project
        shell: bash
        run: |
          set -euo pipefail
          printf '\n#include "wrap_pfc_hooks.h"\n' >> foobar2000/shared/stdafx.cpp
          echo "patched foobar2000/shared/stdafx.cpp:"
          cat foobar2000/shared/stdafx.cpp

      - name: Resolve version + generate version_generated.h
        shell: bash
        working-directory: foobar2000/foo_navidrome
        env:
          NAVIDROME_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="$(scripts/version.sh --header version_generated.h)"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version_generated.h -> COMPONENT_VERSION \"$V\""

      - name: Wire vendored WTL into the include path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wtl = "$env:GITHUB_WORKSPACE\foobar2000\foo_navidrome\third_party\wtl\Include"
          if (-not (Test-Path "$wtl\atlapp.h")) { Write-Error "vendored WTL missing: $wtl\atlapp.h"; exit 1 }
          Write-Host "WTL include: $wtl"
          @"
          <Project>
            <PropertyGroup>
              <IncludePath>$wtl;`$(IncludePath)</IncludePath>
            </PropertyGroup>
          </Project>
          "@ | Set-Content -Path "$env:GITHUB_WORKSPACE\Directory.Build.targets" -Encoding utf8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Release (x64 + Win32)
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = "$PWD\"
          $log = "$env:RUNNER_TEMP\msbuild.log"
          $dist = "$PWD\dist"
          $targets = @(
            @{ Platform = 'x64';     ZipSub = 'x64'     },
            @{ Platform = 'ARM64EC'; ZipSub = 'arm64ec' },
            @{ Platform = 'Win32';   ZipSub = ''        }
          )
          foreach ($t in $targets) {
            $out = "$PWD\out\$($t.Platform)\"
            msbuild src\platform\win\foo_navidrome.vcxproj `
              /p:Configuration=Release `
              /p:Platform=$($t.Platform) `
              /p:PlatformToolset=v143 `
              /p:SolutionDir=$sln `
              /p:OutDir=$out `
              /m /nologo /v:minimal `
              /flp:"logfile=$log;verbosity=detailed;append" `
              "/clp:WarningsOnly;ErrorsOnly;Summary"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "===== MSBuild FAILED for $($t.Platform) (rc=$LASTEXITCODE) — error lines ====="
              if (Test-Path $log) { Select-String -Path $log -Pattern 'error|fatal' | Select-Object -Last 60 | ForEach-Object { $_.Line } }
              exit $LASTEXITCODE
            }
            $dll = "$out\foo_navidrome.dll"
            if (-not (Test-Path $dll)) { Write-Error "foo_navidrome.dll not found for $($t.Platform) at $dll"; exit 1 }
            $destDir = if ($t.ZipSub) { "$dist\$($t.ZipSub)" } else { $dist }
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item $dll "$destDir\foo_navidrome.dll" -Force
            Write-Host "built $($t.Platform) -> $destDir\foo_navidrome.dll"
          }

      - name: Build and run MediaEnrichmentLogic unit tests
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $testOut = "$PWD\out\tests\"
          msbuild tests\MediaEnrichmentTests.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 `
            /p:OutDir=$testOut `
            /m /nologo /v:minimal "/clp:WarningsOnly;ErrorsOnly;Summary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$testOut\MediaEnrichmentTests.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "MediaEnrichmentLogic tests failed"; exit $LASTEXITCODE }

      - name: Upload msbuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: msbuild-log
          path: ${{ runner.temp }}/msbuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package .fb2k-component
        id: pkg
        shell: pwsh
        working-directory: foobar2000/foo_navidrome
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = "$PWD\dist"
          $asset = "foo_navidrome_win_$env:VERSION.fb2k-component"
          $zip = "$dist\$asset"
          Compress-Archive -Path "$dist\foo_navidrome.dll","$dist\x64","$dist\arm64ec" -DestinationPath "$dist\_tmp.zip" -Force
          Move-Item "$dist\_tmp.zip" $zip -Force
          "asset_name=$asset"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=windows-component" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "packaged: $zip"

      - name: Upload component artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-component
          path: |
            foobar2000/foo_navidrome/dist/foo_navidrome_win_*.fb2k-component
            foobar2000/foo_navidrome/dist/foo_navidrome.dll
            foobar2000/foo_navidrome/dist/x64/foo_navidrome.dll
            foobar2000/foo_navidrome/dist/arm64ec/foo_navidrome.dll
          if-no-files-found: error
          retention-days: 14
