name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
      - '.gitignore'
      - 'dev/**'
      - 'tools/**'
      - 'scripts/mac-vm/**'
      - 'scripts/win-vm/**'
      - 'scripts/audiomuse-dev.sh'
      - 'scripts/install-macos.sh'
      - 'scripts/install-windows.sh'
      - 'scripts/navidrome-logs.sh'
      - 'scripts/ui-test.sh'
      - 'scripts/win-test.sh'
      - 'scripts/win-build-local.sh'
      - 'scripts/mac-dev-build.sh'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' || (
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'chore(') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'style(') &&
      !startsWith(github.event.head_commit.message, 'test:') &&
      !startsWith(github.event.head_commit.message, 'test(') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'ci(') )
    outputs:
      next_version: ${{ steps.dry_run.outputs.next_version }}
    steps:
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release + plugins
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@22 \
            conventional-changelog-conventionalcommits@7 \
            @semantic-release/exec@6 \
            @semantic-release/github@9

      - name: Next version (dry run)
        id: dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run

  build-windows:
    needs: version
    if: needs.version.outputs.next_version != ''
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.next_version }}

  build-mac:
    needs: version
    if: needs.version.outputs.next_version != ''
    runs-on: macos-14

    steps:
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: foobar2000/foo_navidrome

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          repository: reupen/foobar2000-sdk-unmodified
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        run: |
          set -euo pipefail
          SDK_INNER="_sdk-staging/foobar2000"
          for d in SDK helpers shared foobar2000_component_client helpers-mac; do
            if [ -d "$SDK_INNER/$d" ]; then
              mv "$SDK_INNER/$d" "foobar2000/$d"
              echo "moved $SDK_INNER/$d -> foobar2000/$d"
            fi
          done
          if [ -d "_sdk-staging/pfc" ]; then
            mv "_sdk-staging/pfc" "pfc"
            echo "moved _sdk-staging/pfc -> pfc"
          fi
          for d in foobar2000/SDK foobar2000/helpers foobar2000/helpers-mac \
                   foobar2000/shared foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              echo "Contents of _sdk-staging root:" >&2
              ls -la _sdk-staging 2>/dev/null || true
              echo "Contents of _sdk-staging/foobar2000:" >&2
              ls -la _sdk-staging/foobar2000 2>/dev/null || true
              exit 1
            fi
          done
          rm -rf _sdk-staging

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and run logic unit tests (native macOS)
        working-directory: foobar2000/foo_navidrome
        run: make mac-test

      - name: Build + package the macOS component
        working-directory: foobar2000/foo_navidrome
        run: ./scripts/mac-ci-build.sh "${{ needs.version.outputs.next_version }}"

      - name: Upload macOS component
        uses: actions/upload-artifact@v6
        with:
          name: mac-component
          path: foobar2000/foo_navidrome/foo_navidrome_${{ needs.version.outputs.next_version }}.fb2k-component
          if-no-files-found: error
          retention-days: 7

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [version, build-windows, build-mac]
    if: needs.version.outputs.next_version != ''
    runs-on: ubuntu-latest

    outputs:
      released_version: ${{ steps.semantic_release.outputs.released_version }}

    steps:
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download the macOS component
        uses: actions/download-artifact@v7
        with:
          name: mac-component
          path: prebuilt/mac

      - name: Download the Windows component
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: prebuilt/win

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release + plugins
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@22 \
            conventional-changelog-conventionalcommits@7 \
            @semantic-release/exec@6 \
            @semantic-release/github@9

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREBUILT_DIR: ${{ github.workspace }}/prebuilt
        run: npx semantic-release

  notify-n8n:
    needs: release
    if: needs.release.outputs.released_version != ''
    runs-on: [self-hosted, homelab]
    steps:
      - name: Notify n8n for foobar2000.org publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.released_version }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          ASSET="foo_navidrome_${VERSION}.fb2k-component"

          RELEASE_JSON=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET" \
            '.assets[] | select(.name == $name) | .url')
          CHANGELOG=$(printf '%s' "$RELEASE_JSON" | jq -r .body)

          CHANGELOG_CLEAN=$(printf '%s' "$CHANGELOG" | perl -0pe '
            s/^## \[.*?\].*\n//m;
            s/^### /\n/mg;
            s/\s*\(\[[0-9a-f]{7,40}\]\([^\)]+\)\)//g;
            s/\n{3,}/\n\n/g;
            s/^\n+//;
            s/\n+$/\n/;
          ')

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: could not resolve download url for $ASSET" >&2
            exit 1
          fi

          curl -sf -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${N8N_WEBHOOK_SECRET}" \
            -d "$(jq -n \
                  --arg version "$VERSION" \
                  --arg changelog "$CHANGELOG_CLEAN" \
                  --arg asset_url "$ASSET_URL" \
                  --arg asset_name "$ASSET" \
                  '{version:$version, changelog:$changelog, asset_url:$asset_url, asset_name:$asset_name}')"
          echo "notified n8n to publish $ASSET (v${VERSION}) to foobar2000.org"
