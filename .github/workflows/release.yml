name: Release

on:
  push:
    branches: [main]

# semantic-release needs to commit version.txt + CHANGELOG.md back to main
# and create GitHub releases / tags.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Cancel in-flight releases if a new push lands (prevents two concurrent
# semantic-release runs racing on the same tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    # Skip the release commit semantic-release itself pushes (avoids loops), and
    # skip commit types that .releaserc.json's commit-analyzer already treats as
    # "no release" (chore/docs/style/test/ci) — no point burning a full macOS
    # xcodebuild just to have semantic-release no-op at the end. Only checks the
    # top commit of the push (head_commit), same limitation as the skip-ci guard.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'chore(') &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'style(') &&
      !startsWith(github.event.head_commit.message, 'test:') &&
      !startsWith(github.event.head_commit.message, 'test(') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'ci(')

    # Expose the version semantic-release resolved (written to $GITHUB_OUTPUT by
    # mac-ci-build.sh's prepareCmd) so the Windows job can attach its x64 component
    # to the same release. Empty when no release was published this run.
    outputs:
      released_version: ${{ steps.semantic_release.outputs.released_version }}

    steps:
      # ----------------------------------------------------------------------
      # Lay out the sibling-directory tree foo_navidrome expects:
      #
      #   {GITHUB_WORKSPACE}/
      #     pfc/                              ← marc2k3/pfc
      #     foobar2000/
      #       SDK/, helpers/, shared/,        ← marc2k3/foobar2000-sdk
      #       foobar2000_component_client/
      #       helpers-mac/                    ← (if present in SDK repo)
      #       foo_navidrome/                  ← this repo
      # ----------------------------------------------------------------------
      - name: Checkout foo_navidrome
        uses: actions/checkout@v6
        with:
          fetch-depth: 0           # semantic-release needs full history
          persist-credentials: true
          path: foobar2000/foo_navidrome

      - name: Checkout foobar2000 SDK bundle
        uses: actions/checkout@v6
        with:
          # reupen/foobar2000-sdk-unmodified is the unmodified official SDK
          # mirror; it includes helpers-mac/ which marc2k3/foobar2000-sdk
          # (aka javascript-panel/foobar2000-sdk via redirect) does not ship.
          repository: reupen/foobar2000-sdk-unmodified
          path: _sdk-staging

      - name: Move SDK subdirs into the expected sibling layout
        run: |
          set -euo pipefail
          # marc2k3/foobar2000-sdk ships its content under a nested foobar2000/
          # subdir (mirroring the official SDK zip). SDK + helpers + shared +
          # foobar2000_component_client + helpers-mac all live there.
          # pfc, libPPUI, columns_ui-sdk are at the staging root.
          SDK_INNER="_sdk-staging/foobar2000"
          for d in SDK helpers shared foobar2000_component_client helpers-mac; do
            if [ -d "$SDK_INNER/$d" ]; then
              mv "$SDK_INNER/$d" "foobar2000/$d"
              echo "moved $SDK_INNER/$d -> foobar2000/$d"
            fi
          done
          # pfc lives at the workspace root (sibling of foobar2000/)
          if [ -d "_sdk-staging/pfc" ]; then
            mv "_sdk-staging/pfc" "pfc"
            echo "moved _sdk-staging/pfc -> pfc"
          fi
          # Verify everything we need is present before continuing
          for d in foobar2000/SDK foobar2000/helpers foobar2000/helpers-mac \
                   foobar2000/shared foobar2000/foobar2000_component_client pfc; do
            if [ ! -d "$d" ]; then
              echo "ERROR: required dir '$d' not found after staging." >&2
              echo "Contents of _sdk-staging root:" >&2
              ls -la _sdk-staging 2>/dev/null || true
              echo "Contents of _sdk-staging/foobar2000:" >&2
              ls -la _sdk-staging/foobar2000 2>/dev/null || true
              exit 1
            fi
          done
          rm -rf _sdk-staging

      # ----------------------------------------------------------------------
      # Toolchain
      # ----------------------------------------------------------------------
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install semantic-release + plugins
        working-directory: foobar2000/foo_navidrome
        run: |
          npm install --no-save --no-package-lock \
            semantic-release@22 \
            conventional-changelog-conventionalcommits@7 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/exec@6 \
            @semantic-release/github@9

      # ----------------------------------------------------------------------
      # Release
      # ----------------------------------------------------------------------
      - name: Run semantic-release
        id: semantic_release
        working-directory: foobar2000/foo_navidrome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows x86 + x64 + ARM64EC binaries, MERGED into one multi-platform
  # .fb2k-component.
  #
  # The actual build lives in the reusable build-windows.yml workflow (also
  # dispatchable on its own for local test builds via win-test.sh). Here we
  # call it for the tag semantic-release just created, then merge-component
  # folds its Windows DLLs into the macOS zip semantic-release already attached,
  # so the release ships ONE foo_navidrome_<ver>.fb2k-component that runs on
  # macOS, Windows x86, Windows x64, and natively on Windows ARM (the layout
  # official components use: mac/<bundle> + <x86 dll at root> + x64/<dll> +
  # arm64ec/<dll> in the same zip; foobar picks the right binary at load time,
  # preferring arm64ec/ on ARM and falling back to x64 emulation if absent).
  #
  # Both jobs are gated on released_version, so they no-op when no release was
  # published. They are NON-GATING for the release itself: the macOS asset has
  # already shipped by the time these run, so a Windows compile failure (the
  # sources are still mid-port) just leaves the release with the mac-only zip.
  # --------------------------------------------------------------------------
  build-windows:
    needs: release
    if: needs.release.outputs.released_version != ''
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: v${{ needs.release.outputs.released_version }}
      version: ${{ needs.release.outputs.released_version }}

  merge-component:
    needs: [release, build-windows]
    if: needs.release.outputs.released_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows component artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: dist

      - name: Merge mac bundle + win-x64 DLL into one .fb2k-component
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.released_version }}
        run: |
          set -euo pipefail
          ASSET="foo_navidrome_${VERSION}.fb2k-component"

          # Pull down the mac-only zip semantic-release just attached. It
          # already contains mac/foo_navidrome.component (ad-hoc signed).
          gh release download "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir .

          # The win artifact ships the raw DLLs at dist/foo_navidrome.dll (x86),
          # dist/x64/foo_navidrome.dll (x64) and dist/arm64ec/foo_navidrome.dll
          # (native Windows-on-ARM) — see build-windows.yml.
          test -f dist/foo_navidrome.dll
          test -f dist/x64/foo_navidrome.dll
          test -f dist/arm64ec/foo_navidrome.dll
          mkdir -p x64 arm64ec
          cp dist/foo_navidrome.dll foo_navidrome.dll
          cp dist/x64/foo_navidrome.dll x64/foo_navidrome.dll
          cp dist/arm64ec/foo_navidrome.dll arm64ec/foo_navidrome.dll

          # Grow the existing zip with the Windows entries: x86 DLL at the root,
          # x64 DLL under x64/, native ARM DLL under arm64ec/ (foobar2000 on ARM
          # prefers arm64ec/, else runs x64 via emulation). `zip -g` appends
          # without rewriting the mac/ entries, so the macOS bundle's bytes (and
          # its ad-hoc code signature) stay byte-for-byte intact.
          zip -g "$ASSET" foo_navidrome.dll x64/foo_navidrome.dll arm64ec/foo_navidrome.dll
          echo "merged multi-platform component contents:"
          unzip -l "$ASSET"

          # Replace the mac-only asset with the merged one (same filename), and
          # relabel it to reflect multi-platform support.
          gh release upload "v${VERSION}" \
            "${ASSET}#foo_navidrome ${VERSION} (macOS + Windows x86/x64/ARM64)" \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded multi-platform $ASSET to release v${VERSION}"

  # --------------------------------------------------------------------------
  # Notify the n8n workflow that publishes this release to the foobar2000.org
  # components admin panel (componentsadmin?action=add-release&component_id=331).
  # n8n holds the foobar2000.org login + does the actual upload; this step only
  # ships it the public release metadata (no credentials involved here).
  #
  # Runs on the self-hosted homelab runner (github-runner LXC, infra-foundations
  # github_runner role): the webhook URL resolves to the LAN NPM -> n8n, bypassing
  # Cloudflare entirely. GitHub-hosted runners previously hit the CF edge, where
  # bot challenge (cf-mitigated: challenge) + DNS/cert gaps blocked the POST.
  # --------------------------------------------------------------------------
  notify-n8n:
    needs: [release, merge-component]
    if: needs.release.outputs.released_version != ''
    runs-on: [self-hosted, homelab]
    steps:
      - name: Notify n8n for foobar2000.org publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.released_version }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_URL }}
          N8N_WEBHOOK_SECRET: ${{ secrets.N8N_FOOBAR_RELEASE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          ASSET="foo_navidrome_${VERSION}.fb2k-component"

          # The homelab runner has no `gh` CLI - fetch release metadata via the API.
          RELEASE_JSON=$(curl -sf \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}")
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET" \
            '.assets[] | select(.name == $name) | .url')
          CHANGELOG=$(printf '%s' "$RELEASE_JSON" | jq -r .body)

          # foobar2000.org's changelog field only supports plain "* item" bullet
          # lines (see /componentsadmin/help-changelog: "does not and will not
          # support any advanced formatting") - semantic-release's markdown
          # (## [version](compare-url) header, ### section headers, per-item
          # ([hash](commit-url)) links) renders as ugly literal text there.
          # Strip it down to section labels + bare bullets.
          CHANGELOG_CLEAN=$(printf '%s' "$CHANGELOG" | perl -0pe '
            s/^## \[.*?\].*\n//m;
            s/^### /\n/mg;
            s/\s*\(\[[0-9a-f]{7,40}\]\([^\)]+\)\)//g;
            s/\n{3,}/\n\n/g;
            s/^\n+//;
            s/\n+$/\n/;
          ')

          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: could not resolve download url for $ASSET" >&2
            exit 1
          fi

          curl -sf -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${N8N_WEBHOOK_SECRET}" \
            -d "$(jq -n \
                  --arg version "$VERSION" \
                  --arg changelog "$CHANGELOG_CLEAN" \
                  --arg asset_url "$ASSET_URL" \
                  --arg asset_name "$ASSET" \
                  '{version:$version, changelog:$changelog, asset_url:$asset_url, asset_name:$asset_name}')"
          echo "notified n8n to publish $ASSET (v${VERSION}) to foobar2000.org"
